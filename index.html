<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngày Yêu - Chúng Ta 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Dancing Script', cursive;
            min-height: 100vh;
            background: linear-gradient(45deg, #ff7eb3, #9b59b6, #1a1a2e);
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .heart {
            font-size: 3em;
            color: #ff3860;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: heartBeat 1.2s infinite;
        }

        .counter {
            font-size: 6em;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 56, 96, 0.5);
            margin: 20px 0;
            opacity: 0;
            transform: scale(0.5);
            animation: fadeIn 1s forwards;
        }

        .quote {
            font-size: 1.8em;
            margin: 20px 0;
            min-height: 60px;
            opacity: 0;
            animation: fadeIn 1s 0.5s forwards;
        }

        .memory-box {
            position: fixed;
            bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Hiệu ứng sao băng */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <div class="counter">0</div>
        <div class="quote"></div>
    </div>
    <div class="memory-box">Mở Hộp Ký ức 💌</div>

    <script>
        // Tạo hiệu ứng sao
        function createStars() {
            const container = document.body;
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                container.appendChild(star);
            }
        }

        // Tính số ngày yêu
        function calculateLoveDays() {
            const startDate = new Date('2024-09-02');
            const currentDate = new Date();
            const diffTime = currentDate - startDate;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        // Hiệu ứng đếm số
        function updateCounter() {
            const target = calculateLoveDays();
            const counter = document.querySelector('.counter');
            let current = 0;
            
            const update = () => {
                if (current < target) {
                    current += Math.ceil(target / 100);
                    if (current > target) current = target;
                    counter.textContent = current;
                    requestAnimationFrame(update);
                }
            }
            requestAnimationFrame(update);
        }

            updateCounter();
            showRandomQuote();
            setInterval(showRandomQuote, 5000);
        });

        // Thêm hiệu ứng hover cho trái tim
        document.querySelector('.heart').addEventListener('mouseover', function() {
            this.style.transform = 'scale(1.5)';
            this.style.filter = 'drop-shadow(0 0 10px #ff3860)';
        });

        document.querySelector('.heart').addEventListener('mouseout', function() {
            this.style.transform = 'scale(1)';
            this.style.filter = 'none';
        });
    </script>
</body>
</html>
